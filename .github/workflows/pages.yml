name: pages

# 部署 docs/ 到 GitHub Pages。
#
# 现状说明：仓库的 Pages `build_type` 目前是 `workflow`，所以必须有这个文件。
# 目标状态是 `legacy`（直接从 `main` 的 `/docs` 读，不经过 artifact 传递）——
# 那更稳，少一跳就少一类故障。但 GitHub 的 Pages API 在切换期间持续返回 500，
# 所以切换推迟。等 API 恢复后：
#
#   gh api -X PUT repos/XiaoBinGan/agent-runtime/pages \
#     -f build_type=legacy -f 'source[branch]=main' -f 'source[path]=/docs'
#
# 然后删掉本文件。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify docs site is not empty
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html 缺失"; exit 1; }
          echo "site files: $(find docs -type f | wc -l)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
